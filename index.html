<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共振軌跡 Resonance - 互動心靈卡牌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f4;
            --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #eef2ef 100%);
            --card-front-bg: linear-gradient(145deg, #3d5447 0%, #2c3e34 100%);
            --card-front-text: #fcfdfc;
            --card-back-bg: rgba(255, 255, 255, 0.88);
            --text-color: #242e29;
            --sub-text: #6e7d75;
            --accent-color: #486659;
            --border-color: #d6ded8;
            --card-inner-border: rgba(72, 102, 89, 0.16);
            --shadow-rest: 
                0 20px 40px -12px rgba(36, 46, 41, 0.16),
                0 4px 12px -2px rgba(36, 46, 41, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            --shadow-back: 
                0 22px 45px -12px rgba(36, 46, 41, 0.12),
                0 4px 12px -2px rgba(36, 46, 41, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        body.love-mode {
            --bg-color: #101116;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1c1e26 0%, #0d0e12 100%);
            --card-front-bg: linear-gradient(145deg, #252833 0%, #161820 100%);
            --card-front-text: #f3e9dc;
            --card-back-bg: rgba(26, 28, 37, 0.85);
            --text-color: #f3e9dc;
            --sub-text: #8c867e;
            --accent-color: #c49564;
            --border-color: #2b2e3b;
            --card-inner-border: rgba(196, 149, 100, 0.22);
            --shadow-rest: 
                0 25px 50px -12px rgba(0, 0, 0, 0.65),
                0 6px 16px -3px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            --shadow-back: 
                0 25px 50px -12px rgba(0, 0, 0, 0.6),
                0 6px 16px -3px rgba(0, 0, 0, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.6s ease, color 0.6s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 模式切換 */
        .mode-switcher {
            display: flex;
            background: rgba(128, 128, 128, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .mode-btn {
            flex: 1;
            border: none;
            padding: 10px 14px;
            border-radius: 26px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: var(--sub-text);
            transition: all 0.35s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* 頂部選單列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
            font-size: 0.85rem;
            gap: 8px;
        }

        .icon-btn {
            background: var(--card-back-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 13px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn:active, .pass-btn:active, .main-btn:active, .cat-btn:active {
            transform: scale(0.96);
        }

        .random-select-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-back-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-color);
            margin-left: auto;
        }

        .random-select {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        /* 分類標籤列 */
        .categories {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background: transparent;
            color: var(--sub-text);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.25s;
        }

        .cat-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        /* 卡牌場景與 3D 結構 + Spring 彈性動畫 */
        .card-scene {
            perspective: 1400px;
            width: 100%;
            height: 390px;
            margin-bottom: 24px;
            cursor: pointer;
            user-select: none;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* Spring 物理彈性貝茲曲線 */
            transition: transform 0.75s cubic-bezier(0.22, 1.35, 0.36, 1);
            border-radius: 26px;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
        }

        /* 卡牌正面：浮雕紙紋 + 斜向微光 */
        .card-front {
            background: var(--card-front-bg);
            color: var(--card-front-text);
            box-shadow: var(--shadow-rest);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* 細微美術紙張斜紋肌理 */
        .card-front::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 0);
            background-size: 16px 16px;
            opacity: 0.7;
            pointer-events: none;
        }

        /* 動態高光層 */
        .card-sheen {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                125deg,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0) 70%
            );
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .card-front-inner {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.15);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .card-front .brand {
            font-size: 0.68rem;
            letter-spacing: 4px;
            opacity: 0.65;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .card-front h2 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.38rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .card-front .tap-hint {
            margin-top: 30px;
            font-size: 0.74rem;
            opacity: 0.6;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
        }

        /* 卡牌背面：磨砂玻璃 Glassmorphism + 精緻邊框 */
        .card-back {
            background: var(--card-back-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-color);
            transform: rotateY(180deg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-back);
            justify-content: space-between;
        }

        .card-back-inner {
            width: 100%;
            height: 100%;
            border: 1px solid var(--card-inner-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-back.action-card {
            border: 1.5px solid var(--accent-color);
        }

        /* 階段精緻膠囊標籤 */
        .stage-badge {
            font-size: 0.72rem;
            color: var(--accent-color);
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(72, 102, 89, 0.09);
            padding: 5px 14px;
            border-radius: 14px;
            border: 1px solid rgba(72, 102, 89, 0.12);
        }

        body.love-mode .stage-badge {
            background: rgba(196, 149, 100, 0.12);
            border-color: rgba(196, 149, 100, 0.18);
        }

        .question-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.14rem;
            line-height: 1.78;
            margin: auto 0;
            font-weight: 400;
            overflow-y: auto;
            max-height: 210px;
            padding: 0 10px;
        }

        .extra-tools {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .science-btn, .timer-btn {
            background: rgba(72, 102, 89, 0.08);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 7px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        body.love-mode .science-btn, body.love-mode .timer-btn {
            background: rgba(196, 149, 100, 0.1);
        }

        /* 底部控制按鈕 */
        .controls {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .main-btn {
            flex: 2;
            background: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transition: transform 0.15s ease, opacity 0.2s;
        }

        .pass-btn {
            flex: 1;
            background: var(--card-back-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 15px 12px;
            border-radius:
